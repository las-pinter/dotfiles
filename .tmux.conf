#------------------------------------------
# Bindings
#------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display "Reloaded"

set -g mouse on

#-------------------------------------------
# Terminal / colors (Ghostty)
#-------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -g focus-events on
set -sg escape-time 0

#-------------------------------------------
# Clipboard
#-------------------------------------------
set -g set-clipboard on
set -g word-separators " "
set -s copy-command 'wl-copy'

#-------------------------------------------
# Sessions
#-------------------------------------------
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @resurrect-capture-pane-contents 'on'

#-------------------------------------------
# Theme: options FIRST, then load
#-------------------------------------------
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, 󰁌,}'
set -g @catppuccin_date_time_text ' %a %d %b %H:%M'

run '~/.tmux/plugins/tmux/catppuccin.tmux'

#-------------------------------------------
# Status bar (after catppuccin, before TPM)
#-------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

set -g  status-left '#{E:@catppuccin_status_session} '
set -g  status-right '#{prefix_highlight}'
set -ag status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'
set -agF status-right '#{E:@catppuccin_status_battery}'
set -ag status-right '#{E:@catppuccin_status_uptime}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

#-------------------------------------------
# Plugins (catppuccin is NOT listed)
#-------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'   # keep last

run '~/.tmux/plugins/tpm/tpm'

# Override tmux-sensible's underline (must come after TPM)
set -g window-status-current-style 'nounderscore'
set -g pane-status-current-style 'nounderscore'
set -g session-status-current-style 'nounderscore'