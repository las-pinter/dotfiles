gui:
  nerdFontsVersion: "3" # icons; needs a Nerd Font in your terminal
  showFileTree: true
  border: rounded
  expandFocusedSidePanel: true
  sidePanelWidth: 0.25
  showNumstatInFilesView: true
git:
  diffRenderers:
    - command: delta --dark --paging=never --side-by-side
  log:
    order: topo-order
    showGraph: when-maximised
  mainBranches: [main, master]
  autoFetch: true
  parseEmoji: true
os:
  editPreset: vim
refresher:
  refreshInterval: 5
  fetchInterval: 60
update:
  method: never
promptToReturnFromSubprocess: false
